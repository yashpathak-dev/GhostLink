{% extends "base.html" %}
{% block title %}GhostLink — Account Access{% endblock %}

{% block content %}
<header class="w-full border-b border-white/5">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-violet-500"></span>
      <span class="font-mono font-semibold tracking-wider text-lg text-white">GHOST<span class="text-violet-400">LINK</span></span>
    </a>
    <a href="/" class="text-xs font-mono text-zinc-400 hover:text-white transition">← Back Home</a>
  </div>
</header>

<main class="max-w-md w-full mx-auto px-4 py-12 flex-grow flex flex-col justify-center">
  <div class="glass-card p-6 sm:p-8 rounded-2xl shadow-2xl">
    <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-zinc-950/80 border border-white/5 mb-6">
      <button type="button" id="tabLogin" onclick="switchAuthMode('login')"
        class="py-2 text-xs font-mono rounded-lg transition cursor-pointer {{ 'bg-violet-600 text-white' if mode != 'register' else 'text-zinc-400 hover:text-white' }}">
        LOG IN
      </button>
      <button type="button" id="tabRegister" onclick="switchAuthMode('register')"
        class="py-2 text-xs font-mono rounded-lg transition cursor-pointer {{ 'bg-violet-600 text-white' if mode == 'register' else 'text-zinc-400 hover:text-white' }}">
        CREATE ACCOUNT
      </button>
    </div>

    {% if error %}
      <div class="mb-5 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs font-mono">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/auth" class="space-y-4">
      <input type="hidden" name="action" id="authAction" value="{{ 'register' if mode == 'register' else 'login' }}" />

      <div id="displayNameGroup" class="{{ '' if mode == 'register' else 'hidden' }}">
        <label class="block text-xs font-mono text-zinc-400 mb-1.5">DISPLAY NAME</label>
        <input type="text" name="display_name" maxlength="40" placeholder="e.g., Yash Pathak"
          class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-mono text-zinc-400 mb-1.5">USERNAME (YOUR PUBLIC LINK)</label>
        <div class="flex items-center bg-zinc-950/80 border border-white/10 rounded-xl px-3.5 focus-within:border-violet-500 transition">
          <span class="text-xs font-mono text-zinc-500 select-none">/u/</span>
          <input type="text" name="username" required minlength="3" maxlength="24" placeholder="yash"
            class="w-full bg-transparent py-3 px-1.5 text-sm font-mono text-white placeholder-zinc-600 focus:outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-mono text-zinc-400 mb-1.5">PASSWORD</label>
        <input type="password" name="password" required minlength="6" placeholder="••••••••"
          class="w-full bg-zinc-950/80 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500 transition" />
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-violet-600 hover:bg-violet-500 text-white font-semibold text-sm py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-violet-600/20 mt-2">
        {{ 'Claim My GhostLink →' if mode == 'register' else 'Enter Dashboard →' }}
      </button>
    </form>
  </div>
</main>

<script>
  function switchAuthMode(mode) {
    document.getElementById("authAction").value = mode;
    const isReg = mode === "register";
    document.getElementById("displayNameGroup").classList.toggle("hidden", !isReg);
    document.getElementById("submitBtn").innerText = isReg ? "Claim My GhostLink →" : "Enter Dashboard →";

    document.getElementById("tabRegister").className = `py-2 text-xs font-mono rounded-lg transition cursor-pointer ${isReg ? "bg-violet-600 text-white" : "text-zinc-400 hover:text-white"}`;
    document.getElementById("tabLogin").className = `py-2 text-xs font-mono rounded-lg transition cursor-pointer ${!isReg ? "bg-violet-600 text-white" : "text-zinc-400 hover:text-white"}`;
  }
</script>
{% endblock %}
